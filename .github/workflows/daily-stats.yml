name: 生成极客炫酷双语指标图

on:
  schedule:
    # 🕗 每天北京时间 8:00 自动更新（UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成极客指标面板
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # ---------- 🎨 全局视觉 ----------
          config_timezone: "Asia/Shanghai"
          config_locale: "zh-CN"
          config_display: "large"
          config_skin: "dark"

          # ---------- 📊 语言雷达 ----------
          plugin_languages: yes
          plugin_languages_ignored: "HTML, CSS"
          plugin_languages_details: "bytes-size, percentage"

          # ---------- 📈 提交热力图 ----------
          plugin_habits: yes
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # ---------- 🗓️ 全年贡献图 ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ---------- ⭐ 项目贡献占比 ----------
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # ---------- 🏆 成就勋章 ----------
          plugin_stars: yes
          plugin_stars_limit: 2

          # ========== ✨ 新增样式插件 ==========
          
          # 1. 📝 显示你最近的活动（如 Push、Issue、PR 等），动态感十足
          plugin_activity: yes
          plugin_activity_days: 7          # 分析最近7天的活动[reference:2]
          plugin_activity_limit: 5         # 显示最近5条活动[reference:3]
          plugin_activity_filter: "all"    # 显示所有类型活动（也可设为 'issue', 'pr' 等）

          # 2. 🧑‍🤝‍🧑 显示你关注的人和组织，展现社交网络
          plugin_people: yes
          plugin_people_limit: 24          # 显示最多24个关注/粉丝[reference:4]
          plugin_people_size: 28           # 头像大小
          plugin_people_types: "followers, following" # 同时显示粉丝和关注

          # 3. 📅 等距视图的贡献日历，比普通日历更立体、更炫酷
          # 注意：这个和 plugin_isocalendar 不同，是立体版本的日历
          plugin_calendar: yes
          plugin_calendar_limit: 1          # 显示最近1年的数据

          # 4. 🏅 展示你获得的 GitHub 成就徽章（如 "Arctic Code Vault Contributor"）
          plugin_achievements: yes
          plugin_achievements_threshold: "B" # 只显示 B 级及以上的成就（A、B 等）[reference:5]
          plugin_achievements_limit: 0       # 0 表示显示所有成就

          # 5. 🔥 显示你最近 Star 的仓库，体现你的技术兴趣圈
          plugin_stars: yes
          plugin_stars_limit: 4              # 显示最近 Star 的4个仓库[reference:6]
