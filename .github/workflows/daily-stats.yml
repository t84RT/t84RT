name: 📊 生成极客炫酷双语指标面板

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 生成 GitHub 极客综合指标面板 (metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # =========================================================
          # 1. 样式与主题 (Theme & Global Options)
          # =========================================================
          config_timezone: "Asia/Shanghai"
          config_locale: "zh-CN"
          config_display: "large"
          config_skin: "dark"                 # 极客暗黑主题
          config_padding: 0, 8%

          # =========================================================
          # 2. 核心数据与基础统计 (Base Statistics)
          # =========================================================
          base: "header, activity, community, repositories, metadata"

          # =========================================================
          # 3. 语言占比雷达 (Languages Radar - 快速版)
          # =========================================================
          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # =========================================================
          # 4. 编码作息与频率习惯 (Coding Habits)
          # =========================================================
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # =========================================================
          # 5. 3D 立体绿图日历 (3D Isometric Calendar)
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================================================
          # 6. 极客成就徽章墙 (Achievements & Secrets)
          # =========================================================
          plugin_achievements: yes
          plugin_achievements_threshold: "B"
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed

          # =========================================================
          # 7. 项目贡献与 Follow 占比 (Followup)
          # =========================================================
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # =========================================================
          # 8. 技术 Stack 图标拓扑 (Topics Icons)
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 12
          plugin_topics_mode: icons

          # =========================================================
          # 9. 精选/高赞仓库卡片 (Stars Showcase)
          # =========================================================
          plugin_stars: yes
          plugin_stars_limit: 4

          # =========================================================
          # 10. 实时 Activity 动态 (Recent Activity)
          # =========================================================
          plugin_activity: yes
          plugin_activity_days: 7
          plugin_activity_limit: 5
          plugin_activity_filter: "all"

          # =========================================================
          # 11. 代码片段与 Gist 展示 (Gists)
          # =========================================================
          plugin_gists: yes                  # 快速展现代码片段/Gist

          # =========================================================
          # 12. 极客运势/随机代码风 (Fortune)
          # =========================================================
          plugin_fortune: yes                # 增加底部极客名言/运势终端

          committer_message: "📊 自动更新全套极客指标面板 [skip ci]"
