name: 📊 生成极客炫酷双语指标面板 + Tophub 每日热榜 + Google News

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ----- 1. 检出代码 -----
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      # ----- 2. 生成 GitHub 指标面板 -----
      - name: 📊 生成 GitHub 极客综合指标面板
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          config_timezone: "Asia/Shanghai"
          config_display: "large"
          config_padding: "0, 8%"

          base: "header, activity, community, repositories, metadata"

          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 12
          plugin_topics_mode: icons

          plugin_stars: yes
          plugin_stars_limit: 4

          plugin_repositories: yes
          plugin_repositories_pinned: 2

          plugin_starlists: yes
          plugin_starlists_limit: 2

          plugin_discussions: yes
          plugin_discussions_categories: yes

          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_ratio: yes

          committer_skip_commit: true

      # ----- 3. 设置 Python -----
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----- 4. 安装依赖 -----
      - name: 📦 安装 Python 依赖
        run: |
          pip install -r requirements.txt

      # ----- 5. 抓取 Tophub -----
      - name: 📰 抓取 Tophub 科技热榜
        run: |
          python scripts/fetch_tophub.py

      # ----- 6. 🆕 抓取 Google News（新增） -----
      - name: 🌐 抓取 Google News 科技热榜
        run: |
          python scripts/fetch_google_news.py

      # ----- 7. 提交并推送所有更新 -----
      - name: 📤 提交并推送所有更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "📊 自动更新全套极客指标 + Tophub + Google News $(date '+%Y-%m-%d')"
            git pull --rebase --autostash origin ${GITHUB_REF#refs/heads/}
            git push origin ${GITHUB_REF#refs/heads/}
          else
            echo "✅ 没有新变更需要提交"
          fi
