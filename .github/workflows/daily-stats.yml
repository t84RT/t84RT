name: 生成极客炫酷双语指标图1

on:
  schedule:
    # 🕗 每天北京时间 8:00 自动更新（UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ========== 第1步：生成主指标面板 ==========
      - name: 生成极客指标面板
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # ---------- 🎨 全局视觉 ----------
          config_timezone: "Asia/Shanghai"
          config_locale: "zh-CN"
          config_display: "large"
          config_skin: "dark"

          # ---------- 📊 语言雷达 ----------
          plugin_languages: yes
          plugin_languages_ignored: "HTML, CSS"
          plugin_languages_details: "bytes-size, percentage"

          # ---------- 📈 提交热力图 ----------
          plugin_habits: yes
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # ---------- 🗓️ 全年贡献图 ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ---------- ⭐ 项目贡献占比 ----------
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # ---------- 🏆 成就勋章 ----------
          plugin_stars: yes
          plugin_stars_limit: 2

          # ========== ✨ 新增样式插件 ==========
          
          # 1. 📝 显示你最近的活动
          plugin_activity: yes
          plugin_activity_days: 7
          plugin_activity_limit: 5
          plugin_activity_filter: "all"

          # 2. 🧑‍🤝‍🧑 显示你关注的人和组织
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: "followers, following"

          # 3. 📅 等距视图的贡献日历
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # 4. 🏅 展示你获得的 GitHub 成就徽章
          plugin_achievements: yes
          plugin_achievements_threshold: "B"
          plugin_achievements_limit: 0

          # 5. 🔥 显示你最近 Star 的仓库
          plugin_stars: yes
          plugin_stars_limit: 4

          commit_message: "📊 自动更新极客指标面板 [skip ci]"

      # ========== 第2步：截图抖音主页 ==========
      - name: 截图抖音主页
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_douyin.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          config_display: "large"
          plugin_screenshot: yes
          plugin_screenshot_title: "抖音主页 - 小吴同学电气设计"
          plugin_screenshot_url: "https://www.douyin.com/user/MS4wLjABAAAAUCfhvxnowxypZgg93FHCEHYHxkkSDq04Scw5aCAaidP8syOQ4PLC-Ygc-8Rdz8cf?from_tab_name=main&relation=0&vid=7619609385589045894"
          plugin_screenshot_selector: "body"
          plugin_screenshot_background: yes
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 1024
            }
          plugin_screenshot_wait: 8000
          commit_message: "📸 截图抖音主页 [skip ci]"

      # ========== 第3步：截图B站主页 ==========
      - name: 截图B站主页
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_bilibili.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          config_display: "large"
          plugin_screenshot: yes
          plugin_screenshot_title: "B站主页 - 硬件与固件深度解析"
          plugin_screenshot_url: "https://space.bilibili.com/482117704/upload/video"
          plugin_screenshot_selector: "body"
          plugin_screenshot_background: yes
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 1024
            }
          plugin_screenshot_wait: 8000
          commit_message: "📸 截图B站主页 [skip ci]"

      # ========== 第4步：截图CSDN博客 ==========
      - name: 截图CSDN博客
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_csdn.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          config_display: "large"
          plugin_screenshot: yes
          plugin_screenshot_title: "CSDN博客 - 技术博客合集"
          plugin_screenshot_url: "https://blog.csdn.net/weixin_45922157/category_13156014.html"
          plugin_screenshot_selector: "body"
          plugin_screenshot_background: yes
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 1024
            }
          plugin_screenshot_wait: 8000
          commit_message: "📸 截图CSDN博客 [skip ci]"

      # ========== 第5步：截图公众号文章 ==========
      - name: 截图公众号文章
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_wechat.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          config_display: "large"
          plugin_screenshot: yes
          plugin_screenshot_title: "公众号文章 - 行业洞察与技术更新"
          plugin_screenshot_url: "https://mp.weixin.qq.com/s/zdcnAVVSTy8TkjIjs_tJGQ"
          plugin_screenshot_selector: "body"
          plugin_screenshot_background: yes
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 1024
            }
          plugin_screenshot_wait: 8000
          commit_message: "📸 截图公众号文章 [skip ci]"
