name: 📊 生成极客炫酷双语指标面板

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 生成 GitHub 极客综合指标面板 (metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # =========================================================
          # 1. 基础全局配置与时区
          # =========================================================
          config_timezone: "Asia/Shanghai"
          config_display: "large"
          config_padding: 0, 8%

          # =========================================================
          # 2. 基础数据 Header & 统计
          # =========================================================
          base: "header, activity, community, repositories, metadata"

          # =========================================================
          # 3. 语言占比雷达 (Languages Radar)
          # =========================================================
          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # =========================================================
          # 4. 编码作息与频率习惯柱状图 (Coding Habits)
          # =========================================================
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # =========================================================
          # 5. 3D 立体绿图日历 (3D Isometric Calendar)
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================================================
          # 6. 项目贡献与 Follow 占比 (Followup)
          # =========================================================
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # =========================================================
          # 7. 技术 Stack 图标拓扑 (Topics Icons)
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 12
          plugin_topics_mode: icons

          # =========================================================
          # 8. 精选/高赞仓库卡片 (Stars Showcase)
          # =========================================================
          plugin_stars: yes
          plugin_stars_limit: 4

          # =========================================================
          # 9. 精选项目与固定仓库 (Featured Repositories)
          # =========================================================
          plugin_repositories: yes
          plugin_repositories_pinned: 2

          # =========================================================
          # 10. Star 列表与收藏库 (Starlists)
          # =========================================================
          plugin_starlists: yes
          plugin_starlists_limit: 2

          # =========================================================
          # 11. 社区讨论参与度 (Discussions)
          # =========================================================
          plugin_discussions: yes
          plugin_discussions_categories: yes

          # =========================================================
          # 12. 开发者 License 协议占比 (Licenses Ratio)
          # =========================================================
          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_ratio: yes

          committer_message: "📊 自动更新全套极客指标面板 [skip ci]"
