name: 📊 生成极客炫酷双语指标面板

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 生成 GitHub 极客综合指标面板 (metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # =========================================================
          # 1. 全局主题与外观控制 (Global Theme & Typography)
          # =========================================================
          config_timezone: "Asia/Shanghai"
          config_locale: "zh-CN"
          config_display: "large"
          config_skin: "dark"                 # 暗黑极客风格
          config_padding: 0, 8%

          # =========================================================
          # 2. 编程语言深度占比雷达 (Languages & Tech Radar)
          # =========================================================
          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_indepth: yes        # 开启深度代码分析

          # =========================================================
          # 3. 编码作息与频率习惯图表 (Coding Habits & Frequency)
          # =========================================================
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes            # 统计习惯事实（如最常提交的时间段）
          plugin_habits_charts: yes           # 绘制时段分布柱状图
          plugin_habits_charts_type: classic

          # =========================================================
          # 4. 3D 立体贡献日历 (3D Isometric Calendar)
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year # 展现全年立体绿图

          # =========================================================
          # 5. 极客成就徽章墙 (Achievements & Badges)
          # =========================================================
          plugin_achievements: yes
          plugin_achievements_threshold: "B"
          plugin_achievements_secrets: yes   # 开启隐藏极客彩蛋徽章
          plugin_achievements_display: detailed # 详细图章渲染模式

          # =========================================================
          # 6. 项目贡献与 Follow 占比 (Repositories & Followup)
          # =========================================================
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # =========================================================
          # 7. 技术栈与领域话题拓扑 (Topics & Tech Stack)
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 12
          plugin_topics_mode: icons           # 转换为漂亮的技术 Icon 标签

          # =========================================================
          # 8. 个人精选/高赞仓库卡片 (Featured Starred Repositories)
          # =========================================================
          plugin_stars: yes
          plugin_stars_limit: 4               # 展出 4 个最具代表性的星标项目

          # =========================================================
          # 9. 实时 Activity 动态追踪 (Recent Activity Flow)
          # =========================================================
          plugin_activity: yes
          plugin_activity_days: 7
          plugin_activity_limit: 5
          plugin_activity_filter: "all"       # 包含 commit, issue, pr 等所有动态

          # =========================================================
          # 10. 极客代码字符风/路线图 (Lines of Code & Fortune)
          # =========================================================
          plugin_lines: yes                   # 统计代码总行数（增删情况）
          
          # =========================================================
          # 11. 项目星标增长趋势图 (Stars Trend)
          # =========================================================
          plugin_stargazers: yes              # 展现 Star 增长趋势轨迹

          # =========================================================
          # 12. 开发者技能与能力蛛网 (Developer Skyline / Traffic)
          # =========================================================
          plugin_traffic: yes                 # 统计个人仓库流量与访客趋势

          committer_message: "📊 自动更新全套极客指标面板 [skip ci]"
