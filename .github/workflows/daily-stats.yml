name: 生成极客炫酷双语指标图

on:
  schedule:
    # 每天北京时间凌晨 4:00 自动更新
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成极客指标面板
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg # 输出的文件名，必须和 README 里引用的一致
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          
          # ---------- 🎨 全局视觉设定 ----------
          config_timezone: "Asia/Shanghai"       # 北京时间
          config_locale: "zh-CN"                 # 极客面板全中英双语显示
          config_display: "large"                # 宽幅大屏排版
          config_skin: "dark"                    # 采用极致暗黑主题(非常酷炫)
          
          # ---------- 📊 核心雷达图(语言) ----------
          plugin_languages: yes
          plugin_languages_ignored: "HTML, CSS"
          plugin_languages_details: "bytes-size, percentage"
          
          # ---------- 📈 实时提交动态(热力图) ----------
          plugin_habits: yes
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # ---------- 🗓️ 一整年绿色十字格贡献图 ----------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ---------- ⭐ 项目贡献占比 ----------
          plugin_followup: yes
          plugin_followup_sections: repositories, commits
          
          # ---------- 🏆 成就勋章 ----------
          plugin_stars: yes
          plugin_stars_limit: 2
