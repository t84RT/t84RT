name: 📊 生成极客炫酷双语指标与动态截图

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # 🌐 启动无头浏览器容器，支持 screenshot 网页截图插件
    services:
      puppeteer:
        image: browserless/chrome
        ports:
          - 3000:3000

    steps:
      # ========== 第 1 步：生成 GitHub 极客综合指标面板 ==========
      - name: 📊 生成 GitHub 极客指标面板 (metrics.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # 🎨 全局风格配置
          config_timezone: "Asia/Shanghai"
          config_locale: "zh-CN"
          config_display: "large"
          config_skin: "dark"

          # 📊 语言占比雷达
          plugin_languages: yes
          plugin_languages_ignored: "HTML, CSS"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_limit: 8

          # 📈 习惯与编码频率图表
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 🗓️ 立体日历与全年贡献
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ⭐ 项目贡献与 Follow 占比
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # 📝 最近活动动态
          plugin_activity: yes
          plugin_activity_days: 7
          plugin_activity_limit: 5
          plugin_activity_filter: "all"

          # 🏅 成就徽章与 Stars 收藏
          plugin_achievements: yes
          plugin_achievements_threshold: "B"
          plugin_stars: yes
          plugin_stars_limit: 4

          commit_message: "📊 自动更新极客指标面板 [skip ci]"

      # ========== 第 2 步：截图抖音主页 ==========
      - name: 📸 截图抖音主页 (metrics_douyin.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_douyin.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "抖音主页 - 小吴同学电气设计"
          plugin_screenshot_url: "https://www.douyin.com/user/MS4wLjABAAAAUCfhvxnowxypZgg93FHCEHYHxkkSDq04Scw5aCAaidP8syOQ4PLC-Ygc-8Rdz8cf"
          plugin_screenshot_selector: "body"
          plugin_screenshot_background: yes
          plugin_screenshot_endpoint: ws://localhost:3000
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 800,
              "deviceScaleFactor": 1
            }
          plugin_screenshot_wait: 6000
          commit_message: "📸 截图抖音主页 [skip ci]"

      # ========== 第 3 步：截图 B 站主页 ==========
      - name: 📸 截图 B 站主页 (metrics_bilibili.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_bilibili.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "B 站主页 - 硬件与固件深度解析"
          plugin_screenshot_url: "https://space.bilibili.com/482117704/upload/video"
          plugin_screenshot_selector: "#app"
          plugin_screenshot_background: yes
          plugin_screenshot_endpoint: ws://localhost:3000
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 800,
              "deviceScaleFactor": 1
            }
          plugin_screenshot_wait: 5000
          commit_message: "📸 截图 B 站主页 [skip ci]"

      # ========== 第 4 步：截图 CSDN 博客 ==========
      - name: 📸 截图 CSDN 博客 (metrics_csdn.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_csdn.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "CSDN 博客 - 技术博客合集"
          plugin_screenshot_url: "https://blog.csdn.net/weixin_45922157"
          plugin_screenshot_selector: "main"
          plugin_screenshot_background: yes
          plugin_screenshot_endpoint: ws://localhost:3000
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 800,
              "deviceScaleFactor": 1
            }
          plugin_screenshot_wait: 5000
          commit_message: "📸 截图 CSDN 博客 [skip ci]"

      # ========== 第 5 步：截图公众号及全网索引 ==========
      - name: 📸 截图公众号与全网索引 (metrics_wechat.svg)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics_wechat.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: "公众号与全网品牌 - 小吴同学电气设计"
          plugin_screenshot_url: "https://cn.bing.com/search?q=%E5%B0%8F%E5%90%B4%E5%90%8C%E5%AD%A6%E7%94%B5%E6%B0%94%E8%AE%BE%E8%AE%A1"
          plugin_screenshot_selector: "#b_results"
          plugin_screenshot_background: yes
          plugin_screenshot_endpoint: ws://localhost:3000
          plugin_screenshot_viewport: |
            {
              "width": 1280,
              "height": 800,
              "deviceScaleFactor": 1
            }
          plugin_screenshot_wait: 4000
          commit_message: "📸 截图公众号与全网索引 [skip ci]"
