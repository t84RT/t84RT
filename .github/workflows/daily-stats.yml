name: 📊 生成极客炫酷双语指标面板 + Tophub 每日热榜

on:
  schedule:
    # 🕗 每天北京时间 08:00 自动更新（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ----- 1. 检出代码（必须先做） -----
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      # ----- 2. 生成 GitHub 指标面板（跳过自动提交） -----
      - name: 📊 生成 GitHub 极客综合指标面板
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: t84RT

          # =========================================================
          # 基础全局配置与时区
          # =========================================================
          config_timezone: "Asia/Shanghai"
          config_display: "large"
          config_padding: 0, 8%

          # =========================================================
          # 基础数据 Header & 统计
          # =========================================================
          base: "header, activity, community, repositories, metadata"

          # =========================================================
          # 语言占比雷达
          # =========================================================
          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # =========================================================
          # 编码作息与频率习惯
          # =========================================================
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          # =========================================================
          # 3D 立体绿图日历
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================================================
          # 项目贡献与 Follow 占比
          # =========================================================
          plugin_followup: yes
          plugin_followup_sections: repositories, commits

          # =========================================================
          # 技术 Stack 图标拓扑
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 12
          plugin_topics_mode: icons

          # =========================================================
          # 精选/高赞仓库卡片
          # =========================================================
          plugin_stars: yes
          plugin_stars_limit: 4

          # =========================================================
          # 精选项目与固定仓库
          # =========================================================
          plugin_repositories: yes
          plugin_repositories_pinned: 2

          # =========================================================
          # Star 列表与收藏库
          # =========================================================
          plugin_starlists: yes
          plugin_starlists_limit: 2

          # =========================================================
          # 社区讨论参与度
          # =========================================================
          plugin_discussions: yes
          plugin_discussions_categories: yes

          # =========================================================
          # 开发者 License 协议占比
          # =========================================================
          plugin_licenses: yes
          plugin_licenses_setup: yes
          plugin_licenses_ratio: yes

          # 🚨 关键：跳过自动提交，后续统一提交
          committer_skip_commit: true

      # ----- 3. 设置 Python 环境（用于 Tophub 抓取） -----
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----- 4. 安装依赖 -----
      - name: 📦 安装 Python 依赖
        run: |
          pip install -r requirements.txt

      # ----- 5. 运行 Tophub 抓取脚本 -----
      - name: 📰 抓取 Tophub 科技热榜
        run: |
          python scripts/fetch_tophub.py

      # ----- 6. 统一提交所有更改（metrics.svg + docs/） -----
      - name: 📤 提交并推送所有更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add metrics.svg docs/
          # 检查是否有变更，若有则提交
          if ! git diff --staged --quiet; then
            git commit -m "📊 自动更新全套极客指标 + Tophub 热榜 $(date '+%Y-%m-%d')"
            git push
          else
            echo "✅ 没有新变更需要提交"
          fi
